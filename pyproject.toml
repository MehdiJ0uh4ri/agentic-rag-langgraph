[project]
name = "agentic-rag-langgraph"
version = "0.1.0"
description = "Agentic RAG: query decomposition, multi-source retrieval, self-grading context, principled refusal."
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.69",
  "langgraph>=0.2.60",
  "langchain-core>=0.3.29",
  "langchain-anthropic>=0.3.3",
  "langsmith>=0.3.0",
  "pydantic>=2.7",
  "rank-bm25>=0.2.2",
  "fastembed>=0.4.2",
  "numpy>=1.26",
  "python-dotenv>=1.0",
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
arag = "agentic_rag.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_rag"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "evals", "tests"]
